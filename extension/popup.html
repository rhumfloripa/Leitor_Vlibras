<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<style>
  body { width: 240px; font-family: system-ui, sans-serif; margin: 0; padding: 16px; background:#0f1420; color:#e8eef7; }
  h1 { font-size: 15px; margin: 0 0 12px; display:flex; align-items:center; gap:6px; }
  .linha { display:flex; align-items:center; justify-content:space-between; margin: 12px 0; font-size: 13px; }
  select { background:#1a2130; color:#e8eef7; border:1px solid #2b3750; border-radius:6px; padding:5px; }
  .switch { position:relative; width:42px; height:24px; }
  .switch input { display:none; }
  .slider { position:absolute; inset:0; background:#2b3750; border-radius:24px; cursor:pointer; transition:.2s; }
  .slider:before { content:""; position:absolute; width:18px; height:18px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s; }
  input:checked + .slider { background:#3d7bf0; }
  input:checked + .slider:before { transform: translateX(18px); }
  .rodape { font-size: 11px; color:#8fa3bf; margin-top: 14px; border-top:1px solid #263048; padding-top:10px; }
</style></head>
<body>
  <h1>🤟 Leitor VLibras</h1>
  <div class="linha">
    <span>Tradução em Libras</span>
    <label class="switch"><input type="checkbox" id="ativo" checked><span class="slider"></span></label>
  </div>
  <div class="linha">
    <span>Velocidade do avatar</span>
    <select id="velocidade">
      <option>0.5x</option><option>1x</option><option>1.5x</option>
      <option>2x</option><option selected>2.5x</option>
    </select>
  </div>
  <div class="rodape">Abra um vídeo no YouTube com legendas ativadas (CC). O avatar aparece no canto inferior direito.</div>
  <script src="popup.js"></script>
</body></html>
